<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#183e36">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Daylist">
  <meta name="description" content="Your daily routines, calendar, and unscheduled task inbox. Private and offline-ready.">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" sizes="180x180" href="./icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Daylist — A clearer day</title>
</head>
<body>
<div id="app">
  <header class="top-bar">
    <div class="brand"><div class="brand-icon" aria-hidden="true">✓</div><span>Daylist</span></div>
    <div class="header-actions"><span id="connectivity" class="connection" title="Offline-ready">● Saved on device</span><button id="add-top" class="icon-button add-top" aria-label="Add task">＋</button></div>
  </header>
  <main id="screen" tabindex="-1"></main>
  <nav class="bottom-nav" aria-label="Main navigation">
    <button data-nav="today" class="nav-button active"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18M8 14l2 2 5-5"/></svg><span>Today</span></button>
    <button data-nav="calendar" class="nav-button"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M8 2v4M16 2v4M3 9h18M7 13h3v3H7zM14 13h3"/></svg><span>Calendar</span></button>
    <button data-nav="inbox" class="nav-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16l2 12v4H2v-4L4 4zM2 15h6l2 3h4l2-3h6"/></svg><span>Inbox <i id="inbox-badge" hidden></i></span></button>
    <button data-nav="routines" class="nav-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10a8 8 0 0 1 14-5l2 2M20 3v4h-4M20 14a8 8 0 0 1-14 5l-2-2M4 21v-4h4"/></svg><span>Routines</span></button>
    <button data-nav="settings" class="nav-button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8v8M8 12h8M4 4h16v16H4z"/></svg><span>More</span></button>
  </nav>
</div>
<dialog id="task-dialog" aria-labelledby="task-dialog-title">
  <form id="task-form" class="sheet">
    <header class="sheet-head"><button class="text-btn" type="button" id="cancel-task">Cancel</button><h2 id="task-dialog-title">New task</h2><button class="text-btn save-btn" type="submit">Save</button></header>
    <label for="task-title">Task</label><input id="task-title" name="title" autocomplete="off" maxlength="180" placeholder="What needs to get done?" required>
    <label for="task-category">Category</label><select id="task-category" name="category"><option>Work</option><option>School</option><option>Personal</option></select>
    <label for="task-repeat">Repeat</label><select id="task-repeat" name="repeat"><option value="none">Doesn't repeat</option><option value="weekdays">Every weekday</option><option value="daily">Every day</option></select>
    <div id="date-setting"><label for="task-date">Schedule</label><select id="task-timing" name="timing"><option value="today">Today</option><option value="pick">Choose a date</option><option value="inbox">Unscheduled — Inbox</option></select><input id="task-date" type="date" name="date" hidden></div>
    <p class="field-note" id="repeat-note" hidden>Repeating tasks start today and show up on each matching day. Checking one day off won't change the others.</p>
    <button type="submit" class="primary-button">Save task</button>
  </form>
</dialog>
<dialog id="action-dialog" aria-labelledby="action-title"><div class="sheet action-sheet"><h2 id="action-title">Task options</h2><div id="action-list"></div><button class="outline-button" id="close-actions" type="button">Cancel</button></div></dialog>
<div id="toast" role="status" aria-live="polite"></div>
<script src="./app.js" defer></script>
</body>
</html>
